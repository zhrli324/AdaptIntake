[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptintake"
version = "0.1.0"
description = "An adaptive pre-consultation agent for older patients (course prototype)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "streamlit>=1.35",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
adaptintake-eval = "adaptintake.evaluation.run:main"
adaptintake-analyze = "adaptintake.evaluation.analyze:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
